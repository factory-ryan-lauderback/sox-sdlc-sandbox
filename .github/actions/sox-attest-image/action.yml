name: sox-attest-image
description: >
  Sign a predicate about one container image and push it to GHCR as an OCI referrer, where
  cluster admission (Kyverno, deploy/kyverno/prod-policy.yaml) reads it. The attestation is also
  stored in the repository's attestation store. Its only subject is the image (actions/attest
  allows exactly one subject when pushing to a registry), so the SOX verifier, which needs a
  sox:<kind>:<id> subject, uses a second attestation of the same predicate signed with
  subject-checksums. Call it from the predicate's pinned signer workflow on main; the job needs
  permissions packages:write, id-token:write, attestations:write, and the job's github.token
  (GHCR does not accept GitHub App installation tokens for pushes).
inputs:
  image:
    description: Image name without tag or digest, e.g. ghcr.io/factory-ryan-lauderback/sox-sdlc-sandbox/api
    required: true
  digest:
    description: sha256:<64 hex>
    required: true
  predicate-type:
    description: Predicate type URI, e.g. https://acme-lending.example/sox/release-approval/v1
    required: true
  predicate-path:
    description: Path to the predicate JSON (already built from API-derived values)
    required: true
  github-token:
    description: The job's github.token
    required: true
outputs:
  bundle-path:
    description: Path to the signed Sigstore bundle
    value: ${{ steps.attest.outputs.bundle-path }}
  attestation-id:
    value: ${{ steps.attest.outputs.attestation-id }}
runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        PTYPE: ${{ inputs.predicate-type }}
        PPATH: ${{ inputs.predicate-path }}
      run: |
        set -euo pipefail
        [[ "$IMAGE" =~ ^ghcr\.io/factory-ryan-lauderback/sox-sdlc-sandbox/[a-z0-9-]+$ ]] || { echo "image must be ghcr.io/factory-ryan-lauderback/sox-sdlc-sandbox/<service>, got $IMAGE"; exit 1; }
        [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest must be sha256:<64 hex>"; exit 1; }
        [[ "$PTYPE" =~ ^https://acme-lending\.example/sox/[a-z-]+/v1$ ]] || { echo "unexpected predicate type $PTYPE"; exit 1; }
        [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "sox-attest-image signs only from refs/heads/main"; exit 1; }
        jq -e 'type == "object"' "$PPATH" > /dev/null
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    - name: Image exists
      shell: bash
      env:
        REF: ${{ inputs.image }}@${{ inputs.digest }}
      run: docker buildx imagetools inspect "$REF" > /dev/null || { echo "$REF is not in the registry"; exit 1; }
    - id: attest
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        predicate-type: ${{ inputs.predicate-type }}
        predicate-path: ${{ inputs.predicate-path }}
        push-to-registry: true
        github-token: ${{ inputs.github-token }}
