name: sox-jira-write
# The only path that writes Jira. Called by agent workflows with a fixed role literal and the name
# pattern of artifacts holding operation lists. Runs in the main-only jira-attestor environment,
# the only place the single sandbox Jira credential exists. Jira records the automation account as
# the author of every write; the acting role is recorded by jira_adapter.apply_ops in the
# `sox.actingRole` issue property and a `[sox:<role>]` comment prefix (workflow-asserted).
# Backend `file` (unit tests and offline demos only) writes jira.json on branch sox-jira-fake.
on:
  workflow_call:
    inputs:
      role:
        type: string
        required: true
      artifact-pattern:
        type: string
        required: true
      ops-digest:
        description: "Optional sha256:<hex> of the single ops file the caller's compose job wrote; anything else is refused"
        type: string
        required: false
        default: ""
    secrets:
      # Environment secrets reach a reusable workflow only if the caller passes them by name; the
      # values used are still the ones in env jira-attestor (main only).
      JIRA_API_TOKEN:
        required: false
      JIRA_ATTESTOR_APP_PRIVATE_KEY:
        required: false
permissions: {}
jobs:
  write:
    runs-on: ubuntu-latest
    environment: jira-attestor
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: sox-jira-write
      cancel-in-progress: false
    steps:
      - name: Refuse to run outside main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ${{ inputs.artifact-pattern }}
          merge-multiple: false
          path: ${{ runner.temp }}/ops
      - id: app
        if: vars.SOX_JIRA_BACKEND == 'file'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.JIRA_ATTESTOR_APP_ID }}
          private-key: ${{ secrets.JIRA_ATTESTOR_APP_PRIVATE_KEY }}
      - name: Apply operations
        env:
          ROLE: ${{ inputs.role }}
          OPS_DIGEST: ${{ inputs.ops-digest }}
          SOX_JIRA_BACKEND: ${{ vars.SOX_JIRA_BACKEND || 'cloud' }}
          SOX_JIRA_EMAIL: ${{ vars.SOX_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SOX_JIRA_STORE_BRANCH: sox-jira-fake
          SOX_JIRA_STORE_TOKEN: ${{ steps.app.outputs.token }}
          SOX_JIRA_FILE: ${{ runner.temp }}/jira-fake/jira.json
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$ROLE" in intake|pm|techlead|review|dev|qa|attestor|bundler) ;; *) echo "bad role"; exit 1;; esac
          shopt -s nullglob globstar
          files=("$RUNNER_TEMP"/ops/**/*.json)
          echo "${#files[@]} operation file(s)"
          if [ -n "$OPS_DIGEST" ]; then
            [ "${#files[@]}" -eq 1 ] || { echo "expected exactly one operation file"; exit 1; }
            [ "sha256:$(sha256sum "${files[0]}" | cut -d' ' -f1)" = "$OPS_DIGEST" ] || { echo "operation file does not match the compose job's digest"; exit 1; }
          fi
          for f in "${files[@]}"; do
            python3 .sox/agents/jira_cli.py apply --ops "$f" --role "$ROLE" --message "$(basename "$(dirname "$f")")"
          done
