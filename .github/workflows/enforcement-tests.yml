name: enforcement-tests
# Platform enforcement tests A-3 (agent branch writers), A-5 (no workflow writes without the
# workflows permission) and agent-branch history, each run as the real App from its main-only
# environment. Fixed test list, no dispatch inputs. Results are a public artifact: HTTP status
# codes and API messages only. Scratch refs are listed in .github/platform/enforcement_tests.py.
# Never a signer or a required check; no id-token or attestations permission.
on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: enforcement-tests
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { role: dev, environment: agent-dev, prefix: DEV }
          - { role: bundler, environment: release-bundler, prefix: BUNDLER }
          - { role: qa, environment: agent-qa, prefix: QA }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
    steps:
      - name: Refuse non-main refs
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = "refs/heads/main" ] || { echo "enforcement-tests runs only from refs/heads/main, not $REF"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars[format('{0}_APP_ID', matrix.prefix)] }}
          private-key: ${{ secrets[format('{0}_APP_PRIVATE_KEY', matrix.prefix)] }}
          permission-contents: write
      - name: Run ${{ matrix.role }} tests
        env:
          SOX_APP_TOKEN: ${{ steps.app.outputs.token }}
          SOX_APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: python3 .github/platform/enforcement_tests.py "${{ matrix.role }}" "enforcement-${{ matrix.role }}.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enforcement-${{ matrix.role }}
          path: enforcement-${{ matrix.role }}.json
          if-no-files-found: warn
          retention-days: 30
