name: sox-release-bundler
# SDLC-04 Release Bundler and SDLC-10 Shipping Dock (tools/sox_release/bundler.py). One idempotent
# sweep per run: create release/<slug> for each Jira fix version with a verified release-manifest,
# sync main into it, squash-merge story PRs whose required checks passed on their head, keep the
# draft release PR in sync, and merge the approved release PR into main with a merge commit.
# Writes use the Release Bundler App (contents and pull requests only), whose key lives in the
# main-only `release-bundler` environment. No dispatch inputs.
# Jira: the sweep never calls Jira. The `snapshot` job reads it through sox-jira-read.yml
# (jira-attestor, preset releases); the sweep uses that snapshot only for candidate release names
# (a verified release-manifest decides) and only if its bytes match the producer's digest. Jira
# updates are an operation list that the `jira` job applies through sox-jira-write.yml as role
# bundler (svc-release-bundler). If the snapshot job fails, the sweep still serves existing
# release/* branches.
on:
  schedule:
    - cron: "*/10 * * * *"
  check_run:
    types: [completed]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: sox-release-bundler
  cancel-in-progress: false

jobs:
  snapshot:
    permissions:
      contents: read
    uses: ./.github/workflows/sox-jira-read.yml
    with:
      preset: releases
      artifact-name: jira-snapshot-releases

  sweep:
    needs: snapshot
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-bundler
    permissions:
      contents: read
      pull-requests: read
      checks: read
      attestations: read
    outputs:
      ops: ${{ steps.sweep.outputs.ops }}
    steps:
      - name: Refuse non-main refs
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = "refs/heads/main" ] || { echo "sox-release-bundler runs only from refs/heads/main, not $REF"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BUNDLER_APP_ID }}
          private-key: ${{ secrets.BUNDLER_APP_PRIVATE_KEY }}
      - if: needs.snapshot.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.snapshot.outputs.artifact-name }}
          path: ${{ runner.temp }}/jira-snapshot
      - name: Sweep
        id: sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOX_GITHUB_TOKEN: ${{ github.token }}
          SOX_BUNDLER_TOKEN: ${{ steps.app.outputs.token }}
          SNAPSHOT_RESULT: ${{ needs.snapshot.result }}
          SNAPSHOT_DIGEST: ${{ needs.snapshot.outputs.digest }}
        run: |
          set -euo pipefail
          snap=()
          if [ "$SNAPSHOT_RESULT" = success ]; then
            snap=(--jira-snapshot "$RUNNER_TEMP/jira-snapshot/snapshot.json" --jira-snapshot-digest "$SNAPSHOT_DIGEST")
          else
            echo "::warning::Jira snapshot job $SNAPSHOT_RESULT; serving existing release branches only"
          fi
          python3 -m tools.sox_release.bundler --out bundler-run.json --jira-ops-out bundler-jira-ops.json "${snap[@]}"
          echo "ops=$(python3 -c 'import json; print(len(json.load(open("bundler-jira-ops.json"))))')" >> "$GITHUB_OUTPUT"
      - if: steps.sweep.outputs.ops != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jira-ops-bundler
          path: bundler-jira-ops.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundler-run
          path: bundler-run.json

  jira:
    needs: sweep
    if: ${{ !cancelled() && needs.sweep.outputs.ops != '' && needs.sweep.outputs.ops != '0' }}
    permissions:
      contents: read
    uses: ./.github/workflows/sox-jira-write.yml
    with:
      role: bundler
      artifact-pattern: jira-ops-bundler
