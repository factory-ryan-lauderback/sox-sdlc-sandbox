name: sox-release-bundler
# SDLC-04 Release Bundler and SDLC-10 Shipping Dock (tools/sox_release/bundler.py). One idempotent
# sweep per run: create release/<slug> for each Jira fix version with a verified release-manifest,
# sync main into it, squash-merge story PRs whose required checks passed on their head, keep the
# draft release PR in sync, and merge the approved release PR into main with a merge commit.
# Writes use the Release Bundler App (contents and pull requests only), whose key lives in the
# main-only `release-bundler` environment. No dispatch inputs.
# Jira: the sweep never calls Jira. It reads a Jira snapshot as data (candidate release names
# only; a verified release-manifest decides) and emits an operation list that the `jira` job
# applies through sox-jira-write.yml as role bundler (svc-release-bundler).
on:
  schedule:
    - cron: "*/10 * * * *"
  check_run:
    types: [completed]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: sox-release-bundler
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-bundler
    permissions:
      contents: read
      pull-requests: read
      checks: read
      attestations: read
    outputs:
      ops: ${{ steps.sweep.outputs.ops }}
    steps:
      - name: Refuse non-main refs
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = "refs/heads/main" ] || { echo "sox-release-bundler runs only from refs/heads/main, not $REF"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BUNDLER_APP_ID }}
          private-key: ${{ secrets.BUNDLER_APP_PRIVATE_KEY }}
      - name: Jira snapshot (data only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKEND: ${{ vars.SOX_JIRA_BACKEND || 'file' }}
        run: |
          # Fake backend: the store on sox-jira-fake, written only by the jira-attestor App.
          # Without a snapshot the sweep still serves releases whose branches exist.
          if [ "$BACKEND" = file ]; then
            curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.raw+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/jira.json?ref=sox-jira-fake" \
              -o "$RUNNER_TEMP/jira-snapshot.json" || echo "::warning::no Jira snapshot; existing release branches only"
          else
            echo "::warning::no Jira snapshot source for backend $BACKEND; existing release branches only"
          fi
      - name: Sweep
        id: sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOX_GITHUB_TOKEN: ${{ github.token }}
          SOX_BUNDLER_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          snap=()
          [ -s "$RUNNER_TEMP/jira-snapshot.json" ] && snap=(--jira-snapshot "$RUNNER_TEMP/jira-snapshot.json")
          python3 -m tools.sox_release.bundler --out bundler-run.json --jira-ops-out bundler-jira-ops.json "${snap[@]}"
          echo "ops=$(python3 -c 'import json; print(len(json.load(open("bundler-jira-ops.json"))))')" >> "$GITHUB_OUTPUT"
      - if: steps.sweep.outputs.ops != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jira-ops-bundler
          path: bundler-jira-ops.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundler-run
          path: bundler-run.json

  jira:
    needs: sweep
    if: ${{ !cancelled() && needs.sweep.outputs.ops != '' && needs.sweep.outputs.ops != '0' }}
    permissions:
      contents: read
    uses: ./.github/workflows/sox-jira-write.yml
    with:
      role: bundler
      artifact-pattern: jira-ops-bundler
