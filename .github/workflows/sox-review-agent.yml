name: sox-review-agent
# SDLC-06 Review Agent. Runs only from main: workflow_dispatch (from the secret-less relay, the
# schedule sweep, or a human) for exactly one PR, plus a schedule sweep that only dispatches.
# Not triggered by pull_request_target directly: for story PRs that event runs the base branch's
# (release/*) copy of this file, whose certificate ref would not be refs/heads/main.
# No job checks out or executes PR code; the diff is fetched through the API as data.
#
# Signing order (gate F13/F16, red team F17): `open` creates the in_progress sox/review-agent check
# run (external_id = this run's ID) BEFORE the model runs. The verdict travels to `record` only as a
# job output, is attested with that checkRunId, and only then does `finish` complete the check with
# the verdict's conclusion and publish the reasoning. Anything else (cancel, timeout, model error,
# invalid verdict, attest failure) leaves the run failed or unfinished, which blocks the head.
# Recovery for a blocked head is a new commit, which then needs its own review, QA and approval.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number. Lookup key only; everything else is re-read from the API."
        required: true
        type: string
  schedule:
    - cron: "11,41 * * * *"

permissions: {}

# Never cancel-in-progress: a cancelled run after `open` would block the head (F13).
concurrency:
  group: sox-review-agent-${{ inputs.pr || 'sweep' }}
  cancel-in-progress: false

env:
  SOX_JIRA_BACKEND: ${{ vars.SOX_JIRA_BACKEND || 'file' }}
  SOX_JIRA_STORE_BRANCH: sox-jira-fake
  SOX_JIRA_FILE: ${{ github.workspace }}/../jira-fake/jira.json

jobs:
  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: write
    steps:
      - name: Refuse to run outside main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .sox/agents/review_agent.py sweep

  # Key-holding: Review App token. Decides whether this head is judged and, if so, opens the binding
  # check run before the model sees anything.
  open:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: agent-review
    timeout-minutes: 10
    concurrency:
      group: sox-review-open-${{ inputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      mode: ${{ steps.open.outputs.mode }}
      check_run_id: ${{ steps.open.outputs.check_run_id }}
      context_digest: ${{ steps.open.outputs.context_digest }}
    steps:
      - name: Refuse to run outside main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
      - id: open
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          REVIEWER_APP_ID: ${{ vars.REVIEW_APP_ID }}
          INPUT_PR: ${{ inputs.pr }}
        run: python3 .sox/agents/review_agent.py open --pr "$INPUT_PR" --out "$RUNNER_TEMP/review"
      # Public PR data only (diff, context); no verdict exists yet.
      - if: steps.open.outputs.check_run_id != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-context
          path: |
            ${{ runner.temp }}/review/context.json
            ${{ runner.temp }}/review/context.md
            ${{ runner.temp }}/review/pr.diff
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jira-ops-review-open
          path: ${{ runner.temp }}/review/jira-ops.json
          if-no-files-found: ignore
          retention-days: 30

  # LLM job: FACTORY_API_KEY and a read-only GITHUB_TOKEN only. No App key, no id-token. The verdict
  # leaves this job only as a job output; nothing about it is printed or uploaded.
  review:
    needs: open
    if: needs.open.outputs.mode == 'llm'
    runs-on: ubuntu-latest
    environment: agent-llm
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.parse.outputs.verdict }}
    steps:
      - name: Refuse to run outside main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-context
          path: ${{ runner.temp }}/review
      - name: Check the context is the one the open job produced
        env:
          WANT: ${{ needs.open.outputs.context_digest }}
        run: test "sha256:$(sha256sum "$RUNNER_TEMP/review/context.json" | cut -d' ' -f1)" = "$WANT"
      - name: Install droid
        uses: ./.github/actions/sox-droid-setup
      - name: Review (droid exec, read-only)
        continue-on-error: true
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          MODEL: ${{ vars.SOX_REVIEW_MODEL }}
        working-directory: ${{ runner.temp }}/review
        run: |
          args=(exec -o json -f "$GITHUB_WORKSPACE/.sox/agents/prompts/review.md")
          if [ -n "$MODEL" ]; then args+=(-m "$MODEL"); fi
          timeout 1200 droid "${args[@]}" > droid.json 2> droid.err || echo "droid exited $?"
      - id: parse
        name: Parse verdict
        env:
          CONTEXT_DIGEST: ${{ needs.open.outputs.context_digest }}
        run: python3 .sox/agents/review_agent.py parse --dir "$RUNNER_TEMP/review"

  # Key-holding: Review App token, id-token, attestations. Checks out main only; reads the PR via API.
  record:
    needs: [open, review]
    if: always() && needs.open.outputs.check_run_id != ''
    runs-on: ubuntu-latest
    environment: agent-review
    timeout-minutes: 15
    concurrency:
      group: sox-review-record-${{ inputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: read
      id-token: write
      attestations: write
    steps:
      - name: Refuse to run outside main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-context
          path: ${{ runner.temp }}/review
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
      - id: rec
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWER_APP_ID: ${{ vars.REVIEW_APP_ID }}
          REVIEWER_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          OPEN_CONTEXT_DIGEST: ${{ needs.open.outputs.context_digest }}
          REVIEW_RESULT: ${{ needs.review.result }}
          VERDICT_B64: ${{ needs.review.outputs.verdict }}
          SOX_REVIEW_MODEL: ${{ vars.SOX_REVIEW_MODEL }}
        run: python3 .sox/agents/review_agent.py record --ctx "$RUNNER_TEMP/review" --out "$RUNNER_TEMP/out"
      - id: attest1
        if: steps.rec.outputs.attest == 'true'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/out/subjects.txt
          predicate-type: https://acme-lending.example/sox/review-verdict/v1
          predicate-path: ${{ runner.temp }}/out/predicate.json
      - id: attest2
        if: steps.rec.outputs.attest == 'true' && steps.attest1.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/out/subjects.txt
          predicate-type: https://acme-lending.example/sox/review-verdict/v1
          predicate-path: ${{ runner.temp }}/out/predicate.json
      # Runs whatever happened above: without a plan the check run completes as failure.
      - name: Complete check run
        if: always() && steps.app.outcome == 'success'
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          CHECK_RUN_ID: ${{ needs.open.outputs.check_run_id }}
          ATTEST_OUTCOME: ${{ steps.attest1.outcome == 'success' && 'success' || steps.attest2.outcome }}
          ATTESTATION_URL: ${{ steps.attest1.outputs.attestation-url || steps.attest2.outputs.attestation-url }}
        run: python3 .sox/agents/review_agent.py finish --out "$RUNNER_TEMP/out"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jira-ops-review-record
          path: ${{ runner.temp }}/out/jira-ops.json
          if-no-files-found: ignore
          retention-days: 30

  jira:
    needs: [open, record]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: ./.github/workflows/sox-jira-write.yml
    with:
      role: review
      artifact-pattern: jira-ops-review-*
