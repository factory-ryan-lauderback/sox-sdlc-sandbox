name: sox-agents-tests
# Unit tests for the agent pipeline code. No secrets, no write permissions.
on:
  pull_request:
    paths: [".sox/agents/**"]
  push:
    branches: [main]
    paths: [".sox/agents/**"]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .sox/agents/tests -v
