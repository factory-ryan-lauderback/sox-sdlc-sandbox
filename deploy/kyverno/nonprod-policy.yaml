# Non-production admission policy (ephemeral story environments eph-* and shared QA qa-*).
# Images must come from this repository's GHCR namespace, pinned by digest, with SLSA build
# provenance signed by sox-env-deploy.yml running from refs/heads/main of this repository.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sox-nonprod-require-provenance
spec:
  background: false
  webhookConfiguration: {failurePolicy: Fail, timeoutSeconds: 30}
  rules:
    - name: registry-and-digest-only
      match: {any: [{resources: {kinds: [Pod], namespaces: ["eph-*", "qa-*"]}}]}
      validate:
        failureAction: Enforce
        message: "images must be ghcr.io/factory-ryan-lauderback/sox-sdlc-sandbox/<service>@sha256:<digest>"
        foreach:
          - list: "request.object.spec.[initContainers, containers, ephemeralContainers][]"
            deny:
              conditions:
                any:
                  - key: "{{ starts_with(element.image, 'ghcr.io/factory-ryan-lauderback/sox-sdlc-sandbox/') }}"
                    operator: Equals
                    value: false
                  - key: "{{ contains(element.image, '@sha256:') }}"
                    operator: Equals
                    value: false
    - name: build-provenance
      match: {any: [{resources: {kinds: [Pod], namespaces: ["eph-*", "qa-*"]}}]}
      verifyImages:
        - imageReferences: ["ghcr.io/factory-ryan-lauderback/sox-sdlc-sandbox/*"]
          type: SigstoreBundle
          failureAction: Enforce
          mutateDigest: false
          verifyDigest: true
          required: true
          imageRegistryCredentials: {secrets: [ghcr-pull]}
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        subject: https://github.com/factory-ryan-lauderback/sox-sdlc-sandbox/.github/workflows/sox-env-deploy.yml@refs/heads/main
                        rekor: {url: https://rekor.sigstore.dev}
              conditions:
                - all:
                    - key: "{{ buildDefinition.buildType }}"
                      operator: Equals
                      value: https://actions.github.io/buildtypes/workflow/v1
                    - key: "{{ buildDefinition.externalParameters.workflow.repository }}"
                      operator: Equals
                      value: https://github.com/factory-ryan-lauderback/sox-sdlc-sandbox
                    - key: "{{ buildDefinition.externalParameters.workflow.ref }}"
                      operator: Equals
                      value: refs/heads/main
